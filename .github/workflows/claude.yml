name: Claude AI Agent Runner

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Claude üçün əmr və ya tapşırıq'
        required: true
        default: 'Agentləri yoxla və sistem hesabatı ver'
  issue_comment:
    types: [created]

jobs:
  claude-exec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Claude Agent Logic
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USER_PROMPT: ${{ github.event.inputs.prompt || 'Salam Claude, reponu idarə et.' }}
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            console.log('🤖 Claude GitHub Actions daxilində işə düşdü!');
            console.log('📝 Əmr:', process.env.USER_PROMPT);

            const agentsDir = path.join(process.cwd(), '.claude', 'agents');
            if (fs.existsSync(agentsDir)) {
              const files = fs.readdirSync(agentsDir);
              console.log('📂 Tapılan agent şablonlarının sayı:', files.length);
            } else {
              console.log('⚠️ Agent qovluğu tapılmadı.');
            }
          "
