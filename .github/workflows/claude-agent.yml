name: Claude GitHub Agent Integrator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-claude-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyanı Yüklə
        uses: actions/checkout@v4

      - name: Node.js Mühitini Qud
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Agent Fayllarını və Claude İnteqrasiyasını Yoxla
        run: |
          echo "GitHub Repozitoriyasında Claude Agent Sistemi Aktivləşdirildi!"
          echo "Mövcud Agent Sayı:"
          ls -1 .claude/agents/*.md | wc -l
